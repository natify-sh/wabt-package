[build-system]
# cmake and ninja come from PyPI so that a plain `pip install` / `uv build` / cibuildwheel container needs
# neither preinstalled; the C++ compiler is the platform's own (build_wabt.py).
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel", "cmake>=3.20", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "wabt-package"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
description = "WABT, the WebAssembly Binary Toolkit (wasm2c, wat2wasm, wasm2wat, ...) as prebuilt binaries and the wasm2c runtime"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["wabt", "webassembly", "wasm", "wasm2c", "wat2wasm", "wasm2wat"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "wabt/LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/ballistics-lab/wabt-package"
"Bug Reports" = "https://github.com/ballistics-lab/wabt-package/issues"
"Source" = "https://github.com/ballistics-lab/wabt-package"
"WABT" = "https://github.com/WebAssembly/wabt"

# One console script per tool of wabt_package.TOOLS: each runs the bundled executable of the same name.
[project.scripts]
spectest-interp = "wabt_package._cli:spectest_interp"
wasm-interp = "wabt_package._cli:wasm_interp"
wasm-objdump = "wabt_package._cli:wasm_objdump"
wasm-stats = "wabt_package._cli:wasm_stats"
wasm-strip = "wabt_package._cli:wasm_strip"
wasm-validate = "wabt_package._cli:wasm_validate"
wasm2c = "wabt_package._cli:wasm2c"
wasm2wat = "wabt_package._cli:wasm2wat"
wast2json = "wabt_package._cli:wast2json"
wat-desugar = "wabt_package._cli:wat_desugar"
wat2wasm = "wabt_package._cli:wat2wasm"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wabt_package"]
include-package-data = false

[tool.setuptools.package-data]
# Built by build_wabt.py into src/wabt_package/ (gitignored) and shipped inside the wheel.
wabt_package = ["bin/*", "wasm2c/*", "include/**/*", "_wabt_version.txt", "_simde_commit.txt", "py.typed"]

[tool.setuptools_scm]
# The package version is the WABT version plus a build number: tag `v1.0.42.0` is WABT 1.0.42, build 0.
# Until the repo has a tag (or no git at all), there is nothing to derive a version from.
root = "."
fallback_version = "0.0.0.dev0"

[tool.uv]
# Rebuild the editable install (and so WABT) when the build hooks or the submodule change, not only
# when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "build_wabt.py" },
    { file = "wabt/CMakeLists.txt" },
    { git = { commit = true } },
]

[tool.cibuildwheel]
# Use uv and build
build-frontend = "build[uv]"
# The wheel holds executables, not a Python extension: setup.py tags it py3-none-<platform>, so it does not
# depend on the interpreter. One interpreter per platform (and per manylinux/musllinux flavour) is enough.
build = "cp312-*"
test-requires = "pytest"
# cibuildwheel runs tests from a scratch directory (not the repo checkout) so only the built
# wheel's contents are ever imported - {project} is substituted with the repo root so pytest can
# still find the test suite itself (tests/ isn't part of the wheel).
test-command = "pytest {project}/tests"

[[tool.cibuildwheel.overrides]]
# The manylinux_2_31 armv7l image is Ubuntu 20.04 with GCC 9, whose libstdc++ lacks <span> and std::bit_cast, which WABT
# (C++20) uses: take GCC 12 (with its static libstdc++) from the toolchain PPA.
select = "*-manylinux_armv7l"
before-all = "apt-get update && apt-get install -y software-properties-common && add-apt-repository -y ppa:ubuntu-toolchain-r/test && apt-get update && apt-get install -y gcc-12 g++-12"
environment = { CC = "gcc-12", CXX = "g++-12" }

[[tool.cibuildwheel.overrides]]
# The manylinux_2_39 riscv64 image (Rocky Linux 10) has no static libstdc++, which the tools are linked with (CRB repository).
select = "*-manylinux_riscv64"
before-all = "dnf install -y libstdc++-static"

[tool.cibuildwheel.macos]
# 11.0 is the floor of arm64 macOS; x86_64 is built on its own runner (plus a universal2 wheel from the arm64 runner).
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
minversion = "9"
addopts = "-rf"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# wabt/ is the upstream submodule: its Python scripts are not ours to format.
extend-exclude = ["wabt"]

[tool.ruff.lint]
ignore = []

[tool.pyright]
include = ["src", "tests"]
exclude = ["wabt", "build"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "setuptools>=77",
    "setuptools-scm>=8",
    "wheel",
    "cmake>=3.20",
    "ninja",
]
